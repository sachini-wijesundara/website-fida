services:
  fida-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fida-web
    restart: unless-stopped
    ports:
      # Access locally at http://localhost:3005 (or set APP_PORT in .env)
      - "${APP_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - fida-image-cache:/app/.cache/fida-images

volumes:
  fida-image-cache:

<!DOCTYPE html>
<html>
<body>
  <canvas id="cobe" width="400" height="400"></canvas>
  <script type="module">
    import createGlobe from './src/components/home/cobe-custom.js';
    
    // Override getShaderParameter to print errors
    const _getShaderParameter = WebGLRenderingContext.prototype.getShaderParameter;
    WebGLRenderingContext.prototype.getShaderParameter = function(shader, pname) {
      const status = _getShaderParameter.call(this, shader, pname);
      if (pname === this.COMPILE_STATUS && !status) {
        console.error("SHADER ERROR:", this.getShaderInfoLog(shader));
      }
      return status;
    };
    
    createGlobe(document.getElementById("cobe"), {
      devicePixelRatio: 2,
      width: 800,
      height: 800,
      phi: 0,
      theta: 0,
      dark: 0, 
      diffuse: 0,
      mapSamples: 32000,
      mapBrightness: 6,
      baseColor: [0.8, 0.8, 0.8],
      markerColor: [0.1, 0.3, 0.6],
      glowColor: [1, 1, 1],
      markers: [],
      onRender: () => {}
    });
  </script>
</body>
</html>
